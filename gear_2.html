<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Albion Gear Guide</title>
<meta name="theme-color" content="#12291f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a quartermaster's armory ledger: dense but calm, made for checking a build fast
   IDEA: the in-game item tooltip, enlarged: icon, tier, stats, then abilities by key
   PICTURE: the open item card with its ability slots is the picture
   COLOUR and TYPE: same forest field and gold as Albion Timers; ability text coloured like in game
   LAYOUT: sticky search and filters, item grid, item detail replaces the grid */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0c1712);--ink:light-dark(#17211c,#e9efe9);--mute:light-dark(#5b6b62,#9db0a5);
--card:light-dark(#f3f6f3,#132219);--line:light-dark(#dbe3dd,#21362a);
--field:#12291f;--field2:#1a3a2c;--gold:#e0b44c;--goldInk:light-dark(#8a6410,#e0b44c);
--dmg:light-dark(#c0392b,#ff7a66);--buff:light-dark(#1d8a4f,#5fd68f);--debuff:light-dark(#a8326e,#f07ab4);--cc:light-dark(#7a4fc4,#b99bff);--heal:light-dark(#1d8a4f,#7fe0a6);--other:light-dark(#8a6410,#e0b44c);--mob:light-dark(#1f6fb0,#7cc0ff)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Cinzel,Georgia,serif;font-weight:700;line-height:1.1;margin:0}
button,input,select{font:inherit;font-size:16px}
button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 14px;cursor:pointer;font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input,select{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px;width:100%}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.wrap{max-width:1240px;margin:0 auto}
header{background:var(--field);color:#eef3ee;padding:max(18px,calc(env(safe-area-inset-top) + 12px)) max(5vw,16px) 18px;position:sticky;top:0;z-index:3;box-shadow:0 4px 18px #0004}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.top h1{font-size:clamp(22px,3vw,30px);color:#fff}.top h1 span{color:var(--gold)}
.top a{color:#eef3ee;text-decoration:none;font-weight:600;border:1px solid #2f5a45;border-radius:10px;padding:10px 14px;white-space:nowrap}
.bar{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:10px}
header input,header select{background:#0a1a13;color:#fff;border-color:#2f5a45}
header input::placeholder{color:#8fa79a}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none}
.chips button{flex:none;background:transparent;color:#cfe0d5;border-color:#2f5a45;min-height:38px}
.chips button[aria-pressed=true]{background:var(--gold);color:#1b1404;border-color:var(--gold)}
main{padding:20px max(5vw,16px) 48px}
.count{color:var(--mute);font-size:14px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.it{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center;text-align:left;padding:8px 12px 8px 8px;min-height:72px;font-weight:500}
.it img,.hd img{width:56px;height:56px;object-fit:contain}
.it b{display:block;font-weight:600;line-height:1.25}
.it small{color:var(--mute);font-size:13px}
.ph{width:56px;height:56px;border-radius:10px;background:var(--field)}
.empty{padding:32px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:14px}
/* detail */
.back{margin-bottom:16px}
.hd{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;align-items:center;background:var(--field);color:#eef3ee;border-radius:18px;padding:16px}
.hd img{width:96px;height:96px}
.hd h2{font-size:clamp(24px,4vw,36px);color:#fff}
.hd p{margin:4px 0 0;color:#b9cdbf}
.sel{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.sel button{min-height:38px;background:var(--field2);border-color:#2f5a45;color:#dce9e0;padding:0 12px}
.sel button[aria-pressed=true]{background:var(--gold);color:#1b1404;border-color:var(--gold)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:20px;margin-top:20px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.panel h3{font-size:19px;margin-bottom:10px}
.st{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.st:last-child{border-bottom:0}.st span{color:var(--mute)}.st b{font-variant-numeric:tabular-nums}
.slot{margin-bottom:18px}.slot:last-child{margin-bottom:0}
.slot h4{margin:0 0 8px;font-size:14px;color:var(--mute);font-weight:600;display:flex;align-items:center;gap:8px}
.key{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:7px;background:var(--field);color:var(--gold);font-weight:700;font-size:14px;padding:0 6px}
.ab{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:8px}
.ab img{width:44px;height:44px;border-radius:8px;background:var(--field)}
.ab b{display:block}
.meta{font-size:13px;color:var(--mute);margin:2px 0 6px}
.desc{font-size:15px;white-space:pre-line}
.m-dmg{color:var(--dmg);font-weight:600}.m-buff{color:var(--buff);font-weight:600}.m-debuff{color:var(--debuff);font-weight:600}
.m-cc{color:var(--cc);font-weight:600}.m-heal{color:var(--heal);font-weight:600}.m-other{color:var(--other);font-weight:600}.m-mobility{color:var(--mob);font-weight:600}.m-shield{color:var(--mob);font-weight:600}
.note{font-size:13px;color:var(--mute);margin-top:14px}
.err{padding:24px;border:1px solid var(--line);border-radius:14px}
@media(max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.bar{grid-template-columns:minmax(0,1fr)}.hd{grid-template-columns:72px minmax(0,1fr)}.hd img{width:72px;height:72px}.grid{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top"><h1>Gear <span>Guide</span></h1><span style="display:flex;gap:8px"><a href="./">Timers</a><a href="map.html">Map</a><a href="craft.html">Crafting</a></span></div>
    <div class="bar">
      <input id="q" type="search" placeholder="Search weapon, armor or ability…" autocomplete="off" aria-label="Search">
      <select id="sub" aria-label="Type"><option value="">All types</option></select>
    </div>
    <div class="chips" id="cats" role="group" aria-label="Category"></div>
  </div>
</header>
<main><div class="wrap" id="view"><p class="count">Loading gear…</p></div></main>

<script>
{
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const CATS = ['All', 'Weapon', 'Off-hand', 'Head', 'Chest', 'Shoes'];
const CAT_LABEL = { All: 'All', Weapon: 'Weapons', 'Off-hand': 'Off-hands', Head: 'Helmets', Chest: 'Chest armor', Shoes: 'Shoes' };
const SUB = {
  arcanestaff: 'Arcane staff', axe: 'Axe', bow: 'Bow', crossbow: 'Crossbow', cursestaff: 'Cursed staff', dagger: 'Dagger', firestaff: 'Fire staff',
  froststaff: 'Frost staff', hammer: 'Hammer', holystaff: 'Holy staff', knuckles: 'War gloves', mace: 'Mace', naturestaff: 'Nature staff',
  quarterstaff: 'Quarterstaff', spear: 'Spear', sword: 'Sword', shapeshifterstaff: 'Shapeshifter staff',
  shieldtype: 'Shield', torchtype: 'Torch', booktype: 'Tome', orbtype: 'Orb',
  cloth_helmet: 'Cloth', leather_helmet: 'Leather', plate_helmet: 'Plate', cloth_armor: 'Cloth', leather_armor: 'Leather', plate_armor: 'Plate',
  cloth_shoes: 'Cloth', leather_shoes: 'Leather', plate_shoes: 'Plate'
};
const subName = s => SUB[s] || s.replace(/_/g, ' ').replace(/type$/, '').replace(/^./, c => c.toUpperCase());
const ICON = (id, size) => `https://render.albiononline.com/v1/item/${encodeURIComponent(id)}.png?size=${size}`;
const SPELL_ICON = id => `https://render.albiononline.com/v1/spell/${encodeURIComponent(id)}.png?size=64`;
let D = null, cat = 'All', sub = '', q = '';
const sel = { t: 4, e: 0 };

function markup(t) {
  return esc(t).replace(/\[(\w+)\]/g, (m, k) => `<span class="m-${k.toLowerCase()}">`).replace(/\[\/\w+\]/g, '</span>');
}
function fmtStat(k, v) {
  if (D.pct.includes(k)) return (v * 100).toFixed(v * 100 % 1 ? 1 : 0).replace(/\.0$/, '') + '%';
  if (k === 'attackspeed') return v.toFixed(2).replace(/0$/, '');
  return Number.isInteger(v) ? v.toLocaleString() : v.toFixed(1);
}

/* ---------- list ---------- */
function matches(l) {
  if (cat !== 'All' && l.c !== cat) return false;
  if (sub && l.sub !== sub) return false;
  if (!q) return true;
  const s = q.toLowerCase();
  if (l.name.toLowerCase().includes(s) || subName(l.sub).toLowerCase().includes(s)) return true;
  return Object.values(l.ab).some(arr => arr.some(id => (D.spells[id]?.n || '').toLowerCase().includes(s)));
}
function fillSubs() {
  const subs = [...new Set(D.lines.filter(l => cat === 'All' || l.c === cat).map(l => l.sub))].sort((a, b) => subName(a).localeCompare(subName(b)));
  if (!subs.includes(sub)) sub = '';
  $('#sub').innerHTML = '<option value="">All types</option>' + subs.map(s => `<option value="${esc(s)}"${s === sub ? ' selected' : ''}>${esc(subName(s))}</option>`).join('');
}
function renderList() {
  const list = D.lines.filter(matches);
  const rows = list.map(l => {
    const t = l.tiers.find(x => x.t === 4) || l.tiers[l.tiers.length - 1];
    return `<button class="it" data-id="${esc(l.id)}"><img loading="lazy" alt="" src="${ICON(t.u, 64)}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph'}))"><span><b>${esc(l.name)}</b><small>${esc(subName(l.sub))} · ${esc(l.c === 'Weapon' && l.two ? 'Two-handed' : l.c === 'Weapon' ? 'One-handed' : CAT_LABEL[l.c])}</small></span></button>`;
  }).join('');
  $('#view').innerHTML = `<p class="count">${list.length} item${list.length === 1 ? '' : 's'}</p>` + (list.length ? `<div class="grid">${rows}</div>` : '<div class="empty">Nothing matches. Try another name or clear the filters.</div>');
}

/* ---------- detail ---------- */
const KEYS = { q: ['Q', 'First ability'], w: ['W', 'Second ability'], e: ['E', 'Third ability'], a: ['★', 'Active ability'], p: ['P', 'Passives'] };
function renderDetail(id) {
  const l = D.lines.find(x => x.id === id);
  if (!l) { location.hash = ''; return; }
  const tiers = l.tiers.filter(t => t.t >= 4).length ? l.tiers.filter(t => t.t >= 4) : l.tiers;
  if (!tiers.find(t => t.t === sel.t)) sel.t = tiers[0].t;
  const T = tiers.find(t => t.t === sel.t);
  if (sel.e >= T.ip.length) sel.e = 0;
  const uid = sel.e ? `${T.u}@${sel.e}` : T.u;
  const stats = Object.entries(T.s).map(([k, v]) => k === 'itempower'
    ? `<div class="st"><span>Item power</span><b>${T.ip[sel.e].toLocaleString()}</b></div>`
    : `<div class="st"><span>${esc(D.labels[k] || k)}</span><b>${fmtStat(k, v)}</b></div>`).join('');
  const slots = Object.entries(l.ab).map(([k, ids]) => `
    <div class="slot"><h4><span class="key">${KEYS[k][0]}</span>${KEYS[k][1]}${ids.length > 1 && k !== 'p' ? ' · pick one' : ''}</h4>
      ${ids.map(sid => { const s = D.spells[sid]; if (!s) return '';
        const meta = [s.cd && `Cooldown ${s.cd}s`, s.en && `Energy ${s.en}`, s.r && `Range ${s.r}m`, s.ct && `Cast ${s.ct}s`].filter(Boolean).join(' · ');
        return `<div class="ab"><img loading="lazy" alt="" src="${SPELL_ICON(sid)}" onerror="this.style.visibility='hidden'"><div><b>${esc(s.n)}</b>${meta ? `<div class="meta">${esc(meta)}</div>` : ''}<div class="desc">${markup(s.d) || '<span class="meta">No description in the game files.</span>'}</div></div></div>`;
      }).join('')}
    </div>`).join('');
  $('#view').innerHTML = `
    <button class="back" type="button" id="back">← All gear</button>
    <div class="hd"><img alt="" src="${ICON(uid, 128)}" onerror="this.style.visibility='hidden'">
      <div><h2>${esc(l.name)}</h2><p>${esc(subName(l.sub))} · ${esc(l.c === 'Weapon' ? (l.two ? 'Two-handed weapon' : 'One-handed weapon') : CAT_LABEL[l.c])} · ${esc(T.n)}</p>
        <div class="sel" aria-label="Tier">${tiers.map(t => `<button data-t="${t.t}" aria-pressed="${t.t === sel.t}">T${t.t}</button>`).join('')}</div>
        <div class="sel" aria-label="Enchantment">${T.ip.map((ip, i) => `<button data-e="${i}" aria-pressed="${i === sel.e}">${T.t}.${i}</button>`).join('')}</div>
      </div></div>
    <div class="cols">
      <div class="panel"><h3>Stats</h3>${stats || '<p class="meta">No stats.</p>'}
        <p class="note">Stats for ${esc(T.n)} at ${T.t}.${sel.e}, normal quality. Enchanting raises item power only.</p></div>
      <div class="panel"><h3>Abilities</h3>${slots || '<p class="meta">This item has no abilities. It only gives the stats shown.</p>'}
        <p class="note">Ability numbers are base values from the game files. In game they grow with your item power, so yours will usually be higher. A "?" is a value the files don't list directly.</p></div>
    </div>`;
  window.scrollTo(0, 0);
}

/* ---------- routing + events ---------- */
function route() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (id && D) renderDetail(id); else if (D) renderList();
}
$('#cats').innerHTML = CATS.map(c => `<button data-c="${c}" aria-pressed="${c === cat}">${CAT_LABEL[c]}</button>`).join('');
$('#cats').onclick = e => { const b = e.target.closest('[data-c]'); if (!b) return; cat = b.dataset.c; document.querySelectorAll('#cats button').forEach(x => x.setAttribute('aria-pressed', x === b)); fillSubs(); if (location.hash) location.hash = ''; else renderList(); };
$('#sub').onchange = () => { sub = $('#sub').value; if (location.hash) location.hash = ''; else renderList(); };
let qt; $('#q').oninput = () => { clearTimeout(qt); qt = setTimeout(() => { q = $('#q').value.trim(); if (location.hash) location.hash = ''; else renderList(); }, 120); };
$('#view').onclick = e => {
  const it = e.target.closest('.it'); if (it) { location.hash = encodeURIComponent(it.dataset.id); return; }
  if (e.target.closest('#back')) { history.length > 1 ? history.back() : (location.hash = ''); return; }
  const t = e.target.closest('[data-t]'); if (t) { sel.t = +t.dataset.t; sel.e = 0; route(); return; }
  const en = e.target.closest('[data-e]'); if (en) { sel.e = +en.dataset.e; route(); }
};
window.addEventListener('hashchange', route);
fetch('gear.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(d => {
  D = d; fillSubs(); route();
}).catch(() => { $('#view').innerHTML = '<div class="err">Couldn\'t load the gear list. Check that gear.json is uploaded next to gear.html, then reload.</div>'; });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
